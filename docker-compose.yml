services:
  app:
    image: tilalx/quotes-rest:latest
    container_name: quotes-rest
    ports:
      - "7080:80"
    environment:
        #postgresql
      - PGHOST=quotes-db
      - PGPORT=5432
      - PGDATABASE=quotes
      - PGDBUSER=postgres
      - PGDBPASSWORD=secretpassword
      - PGSSL=true
      - PGSSLMODE=prefer
      - PGCONNECTTIMEOUT=30
    restart: always

  quotes-db:
    image: docker.io/library/postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    container_name: quotes-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: quotes